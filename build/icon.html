<!doctype html>
<html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
<link rel="stylesheet" href="../src/renderer/shared/avatar.css">
<style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
/* macOS icon grid: 824 px rounded square centred in 1024 */
#tile{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#fff6f8 0%,#ffe1ea 45%,#f7c6d6 100%);box-shadow:inset 0 -18px 40px #e7a9bd66,inset 0 10px 30px #ffffffaa}
#pet{position:absolute;left:50%;transform:translateX(-50%);bottom:-190px;width:920px;height:920px;display:flex;justify-content:center;align-items:flex-end}
#pet>*,#pet svg{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}
</style></head>
<body><div id="tile"><div id="pet"></div></div><script src="../src/renderer/shared/avatars.js"></script></body></html>
