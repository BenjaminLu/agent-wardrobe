<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:">
<title data-i18n="person.title"></title><link rel="stylesheet" href="../avatar.css"><link rel="stylesheet" href="person.css"></head>
<body>
<h1 data-i18n="person.title"></h1>
<p class="note" data-i18n="person.note"></p>
<main>
  <section id="shoot">
    <div id="frame"><video id="video" playsinline muted hidden></video><img id="photo" alt="" hidden><canvas id="canvas" hidden></canvas><p id="hint" data-i18n="person.hint"></p><b id="count" hidden></b></div>
    <div class="row"><button id="camera" type="button" data-i18n="person.camera"></button><button id="snap" type="button" hidden data-i18n="person.snap"></button><label class="button"><span data-i18n="person.pick"></span><input id="file" type="file" accept="image/jpeg,image/png,image/heic" hidden></label></div>
    <p id="status"></p>
  </section>
  <section id="edit">
    <div id="pet"><p id="placeholder" data-i18n="person.placeholder"></p></div>
    <div id="expressions" hidden></div>
    <p id="summary" translate="no"></p>
    <button id="redraw" type="button" class="primary" hidden data-i18n="person.redraw"></button>
    <form id="revise-form" hidden><label><span data-i18n="person.revise.label"></span><input id="revise" maxlength="300" data-i18n-placeholder="person.revise.placeholder"></label><button type="submit" data-i18n="person.revise.submit"></button></form>
    <label><span data-i18n="person.name"></span><input id="name" maxlength="24" data-i18n-placeholder="person.namePlaceholder"></label>
    <div class="row"><button id="save" type="button" class="primary" disabled data-i18n="person.save"></button><button id="cancel" type="button" data-i18n="person.cancel"></button></div>
  </section>
</main>
<script src="../i18n.js"></script><script src="../avatars.js"></script><script src="person.js"></script>
</body></html>
