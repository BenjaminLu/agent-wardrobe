<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:">
<title>用照片做角色</title><link rel="stylesheet" href="../avatar.css"><link rel="stylesheet" href="person.css"></head>
<body>
<h1>用照片做角色</h1>
<p class="note">拍之前先跟對方說一聲 🙂 照片會交給 Codex（用你的帳號）來畫角色，畫完就刪掉，不會存在這台 Mac 上。</p>
<main>
  <section id="shoot">
    <div id="frame"><video id="video" playsinline muted hidden></video><img id="photo" alt="" hidden><canvas id="canvas" hidden></canvas><p id="hint">開相機拍一張，或選一張照片</p><b id="count" hidden></b></div>
    <div class="row"><button id="camera" type="button">📷 開相機</button><button id="snap" type="button" hidden>拍照（3 秒）</button><label class="button">🖼 選照片<input id="file" type="file" accept="image/jpeg,image/png,image/heic" hidden></label></div>
    <p id="status"></p>
  </section>
  <section id="edit">
    <div id="pet"><p id="placeholder">Codex 畫好的角色會出現在這裡</p></div>
    <div id="expressions" hidden></div>
    <p id="summary"></p>
    <button id="redraw" type="button" class="primary" hidden>請 Codex 重畫成可編輯版本</button>
    <form id="revise-form" hidden><label>想怎麼改？<input id="revise" maxlength="300" placeholder="例如：頭髮再短一點、眼鏡改成方框、衣服改藍色"></label><button type="submit">請 Codex 修改</button></form>
    <label>名字<input id="name" maxlength="24" placeholder="朋友的名字"></label>
    <div class="row"><button id="save" type="button" class="primary" disabled>儲存並換上</button><button id="cancel" type="button">取消</button></div>
  </section>
</main>
<script src="../avatars.js"></script><script src="person.js"></script>
</body></html>
