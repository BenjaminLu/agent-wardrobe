<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title data-i18n="assisted.title"></title><link rel="stylesheet" href="assisted.css"></head><body>
<header id="bar">
  <div class="row">
    <button id="back" type="button" data-i18n-title="assisted.back" data-i18n-aria-label="assisted.back">‹</button>
    <select id="site" data-i18n-aria-label="assisted.site.label"></select>
    <form id="find"><input id="query" type="search" maxlength="80" autocomplete="off" data-i18n-placeholder="assisted.query.placeholder" data-i18n-aria-label="assisted.query.label"><button type="submit" data-i18n="assisted.query.go"></button></form>
    <button id="terms" type="button" class="ai" data-i18n="assisted.terms.button"></button>
  </div>
  <div class="row line"><span id="status" aria-live="polite"></span><span id="url" translate="no"></span></div>
</header>
<section id="panel" hidden>
  <div id="summary"></div>
  <div id="candidates" role="radiogroup" data-i18n-aria-label="assisted.candidates.label"></div>
  <div class="actions"><button id="import" type="button" disabled data-i18n="assisted.import.button"></button><button id="dismiss" type="button" data-i18n="assisted.dismiss"></button></div>
  <p class="advisory" data-i18n="assisted.advisory"></p>
</section>
<script src="i18n.js"></script><script src="platform-text.js"></script><script src="assisted.js"></script></body></html>
