<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf6fd"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agent Wardrobe">
<title data-i18n="remote.title">Agent Wardrobe</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="avatar.css"><link rel="stylesheet" href="style.css"></head>
<body>
<section id="pair" hidden>
  <h1 data-i18n="remote.pair.heading"></h1>
  <p data-i18n="remote.pair.intro"></p>
  <form id="pair-form"><input id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required><button data-i18n="remote.pair.button"></button></form>
  <p id="pair-error" class="error"></p>
</section>
<main id="app" hidden>
  <header><b id="name" translate="no">Agent Wardrobe</b><span id="link" data-i18n-title="remote.header.link">●</span><button id="voice" type="button" aria-pressed="false" data-i18n-title="remote.header.voice">🔇</button></header>
  <div id="pet"></div>
  <div id="task-bar" hidden><span id="task-state"></span><button id="task-stop" type="button" data-i18n="remote.task.stop"></button></div>
  <section class="tab" id="tab-chat">
    <div id="dev-bar" hidden><span id="dev-label"></span><button id="dev-stop" type="button" data-i18n="remote.dev.stop"></button><button id="dev-leave" type="button" data-i18n="remote.dev.leave"></button></div>
    <div id="dev-pick-row" hidden><button id="dev-pick" type="button" data-i18n="remote.dev.pick"></button></div>
    <div id="dev-list" hidden></div>
    <div id="log" aria-live="polite" translate="no"></div>
    <button id="stop-speech" type="button" class="stop-speech" hidden data-i18n="remote.chat.stopSpeech"></button>
    <form id="chat"><select id="mode" data-i18n-aria-label="remote.chat.mode"><option value="chat" data-i18n="remote.mode.chat"></option><option value="auto" data-i18n="remote.mode.auto"></option><option value="browser" data-i18n="remote.mode.browser"></option><option value="computer" data-i18n="remote.mode.computer"></option><option value="files" data-i18n="remote.mode.files"></option></select>
      <input id="text" autocomplete="off" maxlength="2000"><button data-i18n="remote.chat.send"></button></form>
  </section>
  <section class="tab" id="tab-characters" hidden>
    <div class="photo-make"><label class="button-like"><span data-i18n="remote.characters.photo"></span><input id="char-photo" type="file" accept="image/*" capture="environment" hidden></label>
      <p class="hint" data-i18n="remote.characters.photoHint"></p></div>
    <input id="outfit-photo" type="file" accept="image/*" capture="environment" hidden>
    <div id="char-list"></div>
  </section>
  <section class="tab" id="tab-store" hidden>
    <form id="lib-form"><input id="lib-q" type="search" data-i18n-placeholder="remote.store.placeholder"><button data-i18n="remote.store.search"></button></form>
    <div class="lib-sources"><label><input type="checkbox" value="featured" checked> <span data-i18n="remote.store.sourceFeatured"></span></label><label><input type="checkbox" value="vroid" checked> VRoid Hub</label><label><input type="checkbox" value="vrm" checked> OSA</label><label><input type="checkbox" value="sketchfab" checked> Sketchfab</label><label><input type="checkbox" value="booru" checked> <span data-i18n="remote.store.sourceBooru"></span></label></div>
    <div class="assist"><span data-i18n="remote.store.assist"></span><button type="button" data-site="booth" translate="no">Booth</button><button type="button" data-site="nizima" translate="no">nizima</button><button type="button" data-site="aplaybox" translate="no">模之屋</button><button type="button" data-site="nico3d" translate="no">ニコニ立体</button><button type="button" data-site="bowlroll" translate="no">BowlRoll</button></div>
    <p id="assist-status" class="hint"></p>
    <p id="lib-status" class="hint"></p><div id="lib-results"></div>
  </section>
  <section class="tab" id="tab-files" hidden><div id="files"></div><article id="viewer" hidden><button id="viewer-back" type="button" data-i18n="remote.files.back"></button><h3 id="viewer-name" translate="no"></h3><div id="viewer-body" translate="no"></div></article></section>
  <section class="tab" id="tab-settings" hidden>
    <label><span data-i18n="remote.settings.phoneLanguage"></span><select id="s-lang"><option value="mac" data-i18n="remote.settings.followMac"></option><option value="zh-Hant" translate="no">繁體中文</option><option value="zh-Hans" translate="no">简体中文</option><option value="en" translate="no">English</option><option value="ja" translate="no">日本語</option></select></label>
    <label><span data-i18n="remote.settings.character"></span><select id="s-mod" translate="no"></select></label><label><span data-i18n="remote.settings.skin"></span><select id="s-skin" translate="no"></select></label><label><span data-i18n="remote.settings.persona"></span><select id="s-persona" translate="no"></select></label>
    <label><span data-i18n="remote.settings.brain"></span><select id="s-brain"><option value="codex">Codex</option><option value="claude">Claude</option><option value="builtin" data-i18n="remote.settings.brainBuiltin"></option><option value="local">LM Studio</option></select></label>
    <label id="s-model-row" hidden><span data-i18n="remote.settings.builtinModel"></span><select id="s-model" translate="no"></select></label>
    <label><span data-i18n="remote.settings.replyLanguage"></span><select id="s-reply"><option value="auto" data-i18n="remote.settings.replyAuto"></option><option value="zh-Hant" translate="no">繁體中文</option><option value="zh-Hans" translate="no">简体中文</option><option value="en" translate="no">English</option><option value="ja" translate="no">日本語</option></select></label>
    <label class="check"><input type="checkbox" id="s-speak"> <span data-i18n="remote.settings.speak"></span></label>
    <label><span data-i18n="remote.settings.voice"></span><select id="s-voice"><option value="edge" data-i18n="remote.settings.voiceEdge"></option><option value="kokoro" data-i18n="remote.settings.voiceKokoro"></option><option value="openai" data-i18n="remote.settings.voiceOpenai"></option><option value="system" data-i18n="remote.settings.voiceSystem"></option><option value="off" data-i18n="remote.settings.voiceOff"></option></select></label>
    <p id="s-note" class="hint"></p>
    <h3 class="sub" data-i18n="remote.settings.ownVoices"></h3><p id="v-note" class="hint"></p><div id="v-list"></div>
    <button id="rec-open" type="button" class="rec-open" data-i18n="remote.settings.recOpen"></button>
  </section>
  <article id="rec" hidden>
    <div class="ed-head"><b data-i18n="remote.settings.recOpen"></b><button id="rec-close" type="button">✕</button></div>
    <div id="rec-consent">
      <p class="rec-q" data-i18n="remote.rec.question"></p>
      <p class="hint" data-i18n="remote.rec.consentHint"></p>
      <input id="rec-person" maxlength="60" data-i18n-placeholder="remote.rec.personPlaceholder">
      <label class="rec-check"><input id="rec-agreed" type="checkbox"> <span data-i18n="remote.rec.agree"></span></label>
      <button id="rec-next" type="button" disabled data-i18n="remote.rec.next"></button>
    </div>
    <div id="rec-record" hidden>
      <label class="rec-row"><span data-i18n="remote.rec.method"></span><select id="rec-engine"><option value="cosyvoice" data-i18n="remote.rec.engineCosy"></option><option value="elevenlabs" data-i18n="remote.rec.engineEleven"></option></select></label>
      <p id="rec-engine-note" class="hint"></p>
      <p class="hint" data-i18n="remote.rec.readThis"></p><blockquote id="rec-prompt" translate="no"></blockquote>
      <div class="rec-row"><button id="rec-another" type="button" data-i18n="remote.rec.another"></button><button id="rec-btn" type="button" class="rec" data-i18n="remote.rec.start"></button><span id="rec-on" class="mic-on" hidden data-i18n="remote.rec.on"></span><span id="rec-time"></span></div>
      <audio id="rec-play" controls hidden></audio>
      <input id="rec-name" maxlength="40" data-i18n-placeholder="remote.rec.namePlaceholder">
      <label class="rec-check"><input id="rec-bind" type="checkbox" checked> <span data-i18n="remote.rec.bind"></span></label>
      <button id="rec-send" type="button" disabled data-i18n="remote.rec.send"></button>
      <p id="rec-status" class="hint"></p>
    </div>
  </article>
  <article id="editor" hidden>
      <div class="ed-head"><b id="ed-title" data-i18n="remote.editor.title"></b><button id="ed-close" type="button">✕</button></div>
      <div id="ed-pet"></div><div id="ed-looks"></div>
      <p id="ed-status" class="hint"></p>
      <button id="ed-redraw" type="button" hidden data-i18n="remote.editor.redraw"></button>
      <form id="ed-revise-form" hidden><input id="ed-revise" data-i18n-placeholder="remote.editor.revisePlaceholder"><button data-i18n="remote.editor.revise"></button></form>
      <form id="ed-save-form" hidden><input id="ed-name" maxlength="24" data-i18n-placeholder="remote.editor.namePlaceholder"><button data-i18n="remote.editor.save"></button></form>
    </article>
  <nav id="tabs"><button data-tab="chat" class="on" data-i18n="remote.tabs.chat"></button><button data-tab="characters" data-i18n="remote.tabs.characters"></button><button data-tab="store" data-i18n="remote.tabs.store"></button><button data-tab="files" data-i18n="remote.tabs.files"></button><button data-tab="settings" data-i18n="remote.tabs.settings"></button></nav>
</main>
<script src="i18n.js"></script><script src="avatars.js"></script><script src="app.js"></script>
</body></html>
