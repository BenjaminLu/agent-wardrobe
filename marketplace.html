<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src blob:"><title data-i18n="marketplace.windowTitle"></title><link rel="stylesheet" href="marketplace.css"><link rel="stylesheet" href="avatar.css"></head><body>
<header><div class="wordmark">WARDROBE <span id="edition">DESKTOP</span></div><span class="shortcut">⌘⇧S</span></header>
<main><p class="eyebrow" id="eyebrow" data-i18n="marketplace.eyebrow"></p><h1 id="title" data-i18n="marketplace.title"></h1><p class="lede" id="lede" data-i18n="marketplace.lede"></p>
<nav id="pages" role="tablist"><button type="button" role="tab" data-page="installed" aria-selected="true" data-i18n="marketplace.tab.installed"></button><button type="button" role="tab" data-page="store" aria-selected="false" data-i18n="marketplace.tab.store"></button></nav>
<div id="page-installed"><div class="search-row"><label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" maxlength="200" data-i18n-aria-label="marketplace.search.ariaLabel" data-i18n-placeholder="marketplace.search.placeholder"><kbd>⌘F</kbd></label><button id="clear" data-i18n="marketplace.clear"></button></div>
<section class="active"><span id="active-label" data-i18n="marketplace.activeLabel"></span><strong id="active-name" translate="no"></strong><label><span id="personality-label" data-i18n="marketplace.personality"></span><select id="personality" translate="no"></select></label></section>
<div class="results-heading"><h2 id="results-label" data-i18n="marketplace.results"></h2><span id="count" aria-live="polite"></span><button id="new-person" type="button" data-i18n="marketplace.newPerson"></button></div><div id="cards"></div><p id="empty" hidden data-i18n="marketplace.empty"></p></div>
<section id="library" hidden>
  <div class="results-heading"><h2 id="library-label" data-i18n="marketplace.store.title"></h2><span id="library-note" data-i18n="marketplace.store.note"></span></div>
  <form id="library-form"><input id="library-query" type="search" maxlength="80" data-i18n-placeholder="marketplace.store.placeholder" data-i18n-aria-label="marketplace.store.ariaLabel">
    <button id="library-go" type="submit" data-i18n="marketplace.store.search"></button>
    <div class="sources">
    <label><input type="checkbox" name="source" value="featured" checked> <span data-i18n="marketplace.store.sourceFeatured"></span></label>
    <label><input type="checkbox" name="source" value="vroid" checked> <span>VRoid Hub</span></label>
    <label><input type="checkbox" name="source" value="vrm" checked> <span>Open Source Avatars</span></label>
    <label><input type="checkbox" name="source" value="sketchfab" checked> <span data-i18n="marketplace.store.sourceSketchfab"></span></label>
    <label><input type="checkbox" name="source" value="booru" checked> <span data-i18n="marketplace.store.sourceBooru"></span></label>
    </div></form>
  <div id="assist-row"><span data-i18n="marketplace.store.assistNote"></span></div>
  <div id="accounts"></div>
  <p id="library-status"></p><div id="library-results"></div>
</section><p id="error" role="alert" hidden></p>
<footer id="scope" data-i18n="marketplace.scope"></footer>
</main><script src="i18n.js"></script><script src="platform-text.js"></script><script src="avatars.js"></script><script src="marketplace.js"></script></body></html>
