<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'none'">
<title data-i18n="voiceLab.title"></title><link rel="stylesheet" href="voice-lab.css"></head>
<body>
<header><h1 data-i18n="voiceLab.heading"></h1><span id="mic-on" class="mic-on" hidden role="status" data-i18n="voiceLab.recording"></span></header>
<p id="error" class="error" role="alert" hidden></p>

<section id="step-method" class="step">
  <h2 data-i18n="voiceLab.method.title"></h2>
  <div class="methods">
    <button type="button" class="method" data-method="quick"><b data-i18n="voiceLab.method.quick"></b><span data-i18n="voiceLab.method.quickHint"></span></button>
    <button type="button" class="method" data-method="train"><b data-i18n="voiceLab.method.train"></b><span data-i18n="voiceLab.method.trainHint"></span></button>
    <button type="button" class="method" data-method="cloud"><b data-i18n="voiceLab.method.cloud"></b><span data-i18n="voiceLab.method.cloudHint"></span></button>
    <button type="button" class="method" data-method="design"><b data-i18n="voiceLab.method.design"></b><span data-i18n="voiceLab.method.designHint"></span></button>
    <button type="button" class="method" data-method="pack"><b data-i18n="voiceLab.method.pack"></b><span data-i18n="voiceLab.method.packHint"></span></button>
  </div>
  <p id="no-voices" class="warn" hidden data-i18n="voiceLab.noVoices"></p>
</section>

<section id="step-consent" class="step" hidden>
  <h2 data-i18n="voiceLab.consent.title"></h2>
  <p data-i18n="voiceLab.consent.body"></p>
  <label><span data-i18n="voiceLab.consent.person"></span><input id="consent-person" maxlength="60" data-i18n-placeholder="voiceLab.consent.personPlaceholder"></label>
  <label class="check"><input id="consent-agreed" type="checkbox"> <span data-i18n="voiceLab.consent.agreed"></span></label>
  <div class="row"><button id="consent-back" type="button" data-i18n="voiceLab.back"></button><button id="consent-next" type="button" class="primary" disabled data-i18n="voiceLab.consent.next"></button></div>
</section>

<section id="step-record" class="step" hidden>
  <h2 id="record-title" data-i18n="voiceLab.record.heading"></h2>
  <div id="engine-status" class="engine"></div>
  <div id="eleven-key" class="key" hidden>
    <label><span data-i18n="voiceLab.elevenKey.label"></span><input id="eleven-key-input" type="password" autocomplete="off" placeholder="sk_…"></label>
    <button id="eleven-key-save" type="button" data-i18n="voiceLab.elevenKey.save"></button>
  </div>
  <div class="prompts"><div class="prompt-head"><b data-i18n="voiceLab.prompt.read"></b><select id="prompt-lang" translate="no"><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option></select><button id="prompt-next" type="button" data-i18n="voiceLab.prompt.next"></button></div>
    <blockquote id="prompt-text" translate="no"></blockquote></div>
  <div class="recorder">
    <button id="record" type="button" class="record" data-i18n="voiceLab.record.start"></button>
    <div class="meter" data-i18n-aria-label="voiceLab.record.meter"><div id="level"></div></div><span id="timer"></span>
    <label class="import"><span data-i18n="voiceLab.record.import"></span><input id="import" type="file" accept=".wav,.mp3,.m4a,.aac,.aif,.aiff,.caf,.flac,audio/*" multiple hidden></label>
  </div>
  <p class="hint" data-i18n="voiceLab.record.hint"></p>
  <ul id="takes"></ul>
  <label id="ref-text-row" hidden><span data-i18n="voiceLab.record.refText"></span><textarea id="ref-text" rows="2"></textarea></label>
  <label id="name-row-cloud" hidden><input id="remove-noise" type="checkbox"> <span data-i18n="voiceLab.record.removeNoise"></span></label>
  <div class="row"><button id="record-back" type="button" data-i18n="voiceLab.back"></button><button id="create" type="button" class="primary" disabled data-i18n="voiceLab.record.create"></button></div>
  <div id="job" class="job" hidden><div class="job-head"><b id="job-title"></b><button id="job-cancel" type="button" data-i18n="voiceLab.job.cancel"></button></div>
    <ol id="job-stages"></ol><div class="bar"><div id="job-bar"></div></div><p id="job-detail" class="hint"></p></div>
</section>

<section id="step-design" class="step" hidden>
  <h2 data-i18n="voiceLab.design.title"></h2>
  <div id="eleven-key-design" class="key" hidden>
    <label><span data-i18n="voiceLab.elevenKey.label"></span><input id="eleven-key-input-2" type="password" autocomplete="off" placeholder="sk_…"></label>
    <button id="eleven-key-save-2" type="button" data-i18n="voiceLab.elevenKey.save"></button>
  </div>
  <label><span data-i18n="voiceLab.design.describe"></span><textarea id="design-prompt" rows="3" maxlength="1000" data-i18n-placeholder="voiceLab.design.placeholder"></textarea></label>
  <div class="row"><button id="design-back" type="button" data-i18n="voiceLab.back"></button><button id="design-go" type="button" class="primary" data-i18n="voiceLab.design.go"></button></div>
  <div id="design-results"></div>
</section>

<section id="step-pack" class="step" hidden>
  <h2 data-i18n="voiceLab.pack.title"></h2>
  <p class="warn" data-i18n="voiceLab.pack.warn"></p>
  <div id="pack-engine" class="engine"></div>
  <label><span data-i18n="voiceLab.pack.refText"></span><input id="pack-ref-text" maxlength="300"></label>
  <div class="row"><button id="pack-back" type="button" data-i18n="voiceLab.back"></button><button id="pack-pick" type="button" class="primary" data-i18n="voiceLab.pack.pick"></button></div>
</section>

<section id="step-finish" class="step" hidden>
  <h2 data-i18n="voiceLab.finish.title"></h2>
  <p id="kept" class="ok"></p>
  <label><span data-i18n="voiceLab.finish.previewLabel"></span><input id="preview-text" maxlength="300"></label>
  <div class="row"><button id="preview" type="button" data-i18n="voiceLab.finish.preview"></button><audio id="preview-audio" controls hidden></audio></div>
  <label><span data-i18n="voiceLab.finish.name"></span><input id="voice-name" maxlength="40" data-i18n-placeholder="voiceLab.finish.namePlaceholder"></label>
  <label class="check"><input id="bind" type="checkbox" checked> <span id="bind-label"></span></label>
  <div class="row"><button id="finish-back" type="button" data-i18n="voiceLab.finish.restart"></button><button id="save" type="button" class="primary" data-i18n="voiceLab.finish.save"></button></div>
  <p id="saved" class="ok" hidden></p>
</section>
<script src="i18n.js"></script><script src="platform-text.js"></script><script src="voice-lab.js"></script>
</body></html>
