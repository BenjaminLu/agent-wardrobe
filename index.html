<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src blob:"><title>Agent Wardrobe</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="avatar.css"></head>
<body>
<main>
  <section id="onboarding" hidden aria-live="polite">
    <div class="ob-steps"><span></span><span></span><span></span><span></span></div>
    <div class="ob-page" data-step="0">
      <h2 data-i18n="onboarding.brain.title"></h2>
      <p data-i18n="onboarding.brain.intro"></p>
      <div class="ob-choices" id="ob-brains"></div>
      <div id="ob-llm" hidden><p class="ob-note" data-i18n="onboarding.brain.llmNote"></p><div class="ob-choices" id="ob-llm-models"></div></div>
    </div>
    <div class="ob-page" data-step="1" hidden>
      <h2 data-i18n="onboarding.voice.title"></h2>
      <div class="ob-choices">
        <label><input type="radio" name="ob-voice" value="edge"><b data-i18n="onboarding.voice.edge"></b><small data-i18n="onboarding.voice.edgeHint"></small></label>
        <label><input type="radio" name="ob-voice" value="kokoro"><b data-i18n="onboarding.voice.kokoro"></b><small data-i18n="onboarding.voice.kokoroHint"></small></label>
        <label><input type="radio" name="ob-voice" value="system"><b data-i18n="onboarding.voice.system"></b><small data-i18n="onboarding.voice.systemHint"></small></label>
        <label><input type="radio" name="ob-voice" value="off"><b data-i18n="onboarding.voice.off"></b><small data-i18n="onboarding.voice.offHint"></small></label>
      </div>
      <p class="ob-note" data-i18n="onboarding.voice.openaiNote"></p>
      <button type="button" id="ob-preview" class="preview" data-i18n="onboarding.voice.preview"></button>
    </div>
    <div class="ob-page" data-step="2" hidden>
      <h2 data-i18n="onboarding.wake.title"></h2>
      <p><span data-i18n="onboarding.wake.sayBefore"></span><b id="ob-wake-word" translate="no"></b><span data-i18n="onboarding.wake.sayAfter"></span></p>
      <label class="check"><input type="checkbox" id="ob-wake"> <span data-i18n="onboarding.wake.enable"></span></label>
      <label class="check"><input type="checkbox" id="ob-asr"> <span data-i18n="onboarding.wake.asr"></span></label>
    </div>
    <div class="ob-page" data-step="3" hidden>
      <h2 data-i18n="onboarding.done.title"></h2>
      <ul>
        <li data-i18n="onboarding.done.tip1"></li>
        <li data-i18n="onboarding.done.tip2"></li>
        <li data-i18n="onboarding.done.tip3"></li>
        <li data-i18n="onboarding.done.tip4"></li>
        <li data-i18n="onboarding.done.tip5"></li>
      </ul>
    </div>
    <div class="ob-nav"><button type="button" id="ob-skip" data-i18n="onboarding.skip"></button><button type="button" id="ob-back" hidden data-i18n="onboarding.back"></button><button type="button" id="ob-next" data-i18n="onboarding.next"></button></div>
  </section>
  <section id="panel">
    <header class="drag"><span class="brand" translate="no">ANNIE<span class="dot"></span></span><button id="chat-size" class="nodrag" data-i18n-title="chat.size" data-i18n-aria-label="chat.sizeAria">⤢</button><button id="settings-toggle" class="nodrag" data-i18n-title="settings.title" data-i18n-aria-label="settings.title"><span aria-hidden="true">⚙</span> <span id="settings-label" data-i18n="settings.title"></span></button><button id="close" data-i18n-title="chat.close" class="nodrag">×</button></header>
    <div id="settings" hidden>
      <nav id="settings-nav" role="tablist" data-i18n-aria-label="settings.nav.aria">
        <button type="button" data-pane="brain">🧠<span data-i18n="settings.nav.brain"></span></button>
        <button type="button" data-pane="voice">🔊<span data-i18n="settings.nav.voice"></span></button>
        <button type="button" data-pane="wake">🎙<span data-i18n="settings.nav.wake"></span></button>
        <button type="button" data-pane="characters">🎭<span data-i18n="settings.nav.characters"></span></button>
        <button type="button" data-pane="games">🎮<span data-i18n="settings.nav.games"></span></button>
        <button type="button" data-pane="remote">📱<span data-i18n="settings.nav.remote"></span></button>
        <button type="button" data-pane="general">⚙️<span data-i18n="settings.nav.general"></span></button>
      </nav>
      <div id="settings-panes">
      <section class="pane" data-pane="brain" hidden><h3 class="pane-title" data-i18n="settings.nav.brain"></h3>
        <label data-i18n="settings.nav.brain"><select id="provider"><option value="codex">Codex</option><option value="claude">Claude</option><option value="builtin" data-i18n="settings.brain.builtin"></option><option value="local" data-i18n="settings.brain.lmstudio"></option></select></label>
        <div id="cli-setup" class="voice-row" hidden><span id="cli-status"></span><button type="button" id="cli-install" data-i18n="settings.cli.install"></button></div>
        <div id="builtin-settings" hidden><div class="ob-choices" id="llm-models"></div><progress id="llm-progress" max="1" value="0" hidden></progress><div class="voice-row"><span id="llm-status"></span><button type="button" id="llm-install" data-i18n="settings.llm.install"></button><button type="button" id="llm-remove" hidden data-i18n="settings.llm.remove"></button></div></div>
        <div id="local-settings" hidden><label data-i18n="settings.brain.base"><input id="base" value="http://127.0.0.1:1234/v1"></label><label data-i18n="settings.brain.model"><input id="model"></label></div>
        <label data-i18n="settings.brain.replyLanguage"><select id="reply-language"><option value="auto" data-i18n="settings.brain.replyLanguageAuto"></option><option value="zh-Hant" translate="no">繁體中文</option><option value="zh-Hans" translate="no">简体中文</option><option value="en" translate="no">English</option><option value="ja" translate="no">日本語</option></select></label>
        <label data-i18n="settings.brain.taskMode"><select id="task-mode" data-i18n-aria-label="settings.brain.taskMode"><option value="auto" data-i18n="settings.brain.taskMode.auto"></option><option value="chat" data-i18n="settings.brain.taskMode.chat"></option><option value="computer" data-i18n="settings.brain.taskMode.computer"></option><option value="browser" data-i18n="settings.brain.taskMode.browser"></option><option value="files" data-i18n="settings.brain.taskMode.files"></option></select></label>
        <div class="voice-row"><button id="agent-console" data-i18n="settings.brain.console"></button></div>
        <p data-i18n="settings.brain.privacy"></p>
        <p id="operation-help" data-i18n="settings.brain.operationHelp"></p>
        <div id="operation-permissions" data-mac-only><button data-permission="screen" data-i18n="settings.brain.permScreen"></button><button data-permission="accessibility" data-i18n="settings.brain.permAccessibility"></button></div>
        <button id="official-setup" data-i18n="settings.brain.officialSetup"></button>
        <div id="dev-settings"><b class="section-title" data-i18n="settings.dev.title"></b>
          <p class="voice-note" data-i18n="settings.dev.note"></p>
          <div class="voice-row"><button type="button" id="dev-pick" data-i18n="settings.dev.pick"></button></div></div>
      </section>
      <section class="pane" data-pane="voice" hidden><h3 class="pane-title" data-i18n="settings.nav.voice"></h3>
        <div id="voice-current" class="voice-current">
          <p id="voice-current-text"></p>
          <label><span id="voice-for-label"></span><select id="voice-for" data-i18n-aria-label="settings.voice.forAria"></select></label>
        </div>
        <div id="voice-default"><b class="section-title" data-i18n="settings.voice.defaultTitle"></b><p class="voice-note" id="voice-default-note" data-i18n="settings.voice.defaultNote"></p>
        <div id="voice-settings">
          <label data-i18n="settings.voice.label"><select id="voice-provider"><option value="edge" data-i18n="settings.voice.provider.edge"></option><option value="kokoro" data-i18n="settings.voice.provider.kokoro"></option><option value="openai" data-i18n="settings.voice.provider.openai"></option><option value="system" data-i18n="settings.voice.provider.system"></option><option value="off" data-i18n="settings.voice.provider.off"></option></select></label>
          <div id="edge-voice" hidden>
            <label data-i18n="settings.voice.voice"><select id="edge-voice-name"></select></label>
            <label data-i18n="settings.voice.speed"> <span id="edge-rate-value">1.0×</span><input id="edge-rate" type="range" min="0.7" max="1.5" step="0.05" value="1"></label>
            <div class="voice-row"><button type="button" id="edge-preview" class="preview" data-i18n="settings.voice.preview"></button></div>
            <p class="voice-note" data-i18n="settings.voice.edgeNote"></p>
          </div>
          <div id="kokoro-voice" hidden>
            <div class="voice-row"><span id="kokoro-status"></span><button type="button" id="kokoro-install" data-i18n="settings.voice.kokoroInstall"></button></div>
            <progress id="kokoro-progress" max="1" value="0" hidden></progress>
            <label data-i18n="settings.voice.voice"><select id="kokoro-voice-name"></select></label>
            <label data-i18n="settings.voice.speed"> <span id="kokoro-speed-value">1.0×</span><input id="kokoro-speed" type="range" min="0.7" max="1.4" step="0.05" value="1"></label>
            <div class="voice-row"><button type="button" id="kokoro-preview" class="preview" data-i18n="settings.voice.preview"></button></div>
            <p class="voice-note" data-i18n="settings.voice.kokoroNote"></p>
          </div>
          <div id="openai-voice" hidden>
            <label data-i18n="settings.voice.voice"><select id="openai-voice-name"></select></label>
            <label data-i18n="settings.voice.model"><select id="openai-model"><option value="gpt-4o-mini-tts" data-i18n="settings.voice.openaiModel.mini"></option><option value="tts-1" data-i18n="settings.voice.openaiModel.tts1"></option><option value="tts-1-hd" data-i18n="settings.voice.openaiModel.tts1hd"></option></select></label>
            <label data-i18n="settings.voice.style"><input id="openai-style" maxlength="1000"></label>
            <div class="voice-row"><span id="openai-key-status"></span><button type="button" id="openai-key-toggle" data-i18n="settings.voice.keySetUp"></button><button type="button" id="voice-preview" class="preview" data-i18n="settings.voice.preview"></button></div>
            <div id="openai-key-guide" hidden>
              <ol>
                <li><span data-i18n="settings.voice.guide1Before"></span><button type="button" data-openai="keys" data-i18n="settings.voice.guide1Link"></button><span data-i18n="settings.voice.guide1After"></span></li>
                <li data-i18n="settings.voice.guide2"></li>
                <li><span data-i18n="settings.voice.guide3Before"></span><button type="button" data-openai="billing" data-i18n="settings.voice.guide3Billing"></button><span data-i18n="settings.voice.guide3Middle"></span><button type="button" data-openai="usage" data-i18n="settings.voice.guide3Usage"></button><span data-i18n="settings.voice.guide3After"></span></li>
                <li data-i18n="settings.voice.guide4"></li>
              </ol>
              <label>API key<input id="openai-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…"></label>
              <div class="voice-row"><button type="button" id="openai-key-save" data-i18n="settings.voice.keySave"></button><button type="button" id="openai-key-clear" data-i18n="settings.voice.keyClear"></button></div>
              <p id="openai-key-note" data-i18n="settings.voice.keyNote"></p>
            </div>
          </div>
        </div>
          </div>
      <div id="voices-settings"><b class="section-title" data-i18n="settings.voices.title"></b><p class="voice-note" data-i18n="settings.voices.note"></p>
          <p id="voices-bound" class="voice-note"></p>
          <p id="voices-lang" class="voice-note" hidden><span data-i18n="settings.voices.japaneseOnly"></span><button type="button" id="voices-japanese" data-i18n="settings.voices.useJapanese"></button></p>
          <ul id="voices-list"></ul>
          <div class="voice-row"><span class="voice-note" data-i18n="settings.voices.newLabel"></span><button type="button" id="voice-new-mix" data-i18n="settings.voices.newMix"></button><button type="button" id="voice-new-vv" data-i18n="settings.voices.newVv"></button>
            <!-- 錄音複製 opens the 聲音工作室 window (voice-lab.cjs) -->
            <button type="button" id="voice-lab" hidden data-i18n="settings.voices.lab"></button>
            <button type="button" id="voice-import" data-i18n="settings.voices.import"></button></div>
          <div id="voice-mix" hidden>
            <label data-i18n="settings.mix.name"><input id="mix-name" maxlength="40"></label>
            <label data-i18n="settings.mix.style"><select id="mix-preset"></select></label>
            <label data-i18n="settings.mix.a"><select id="mix-a"></select></label>
            <label data-i18n="settings.mix.b"><select id="mix-b"></select></label>
            <label data-i18n="settings.mix.blend"> <span id="mix-blend-value"></span><input id="mix-blend" type="range" min="0" max="100" step="5" value="60"></label>
            <label data-i18n="settings.mix.pitch"> <span id="mix-pitch-value"></span><input id="mix-pitch" type="range" min="-6" max="8" step="1" value="0"></label>
            <label data-i18n="settings.voice.speed"> <span id="mix-speed-value"></span><input id="mix-speed" type="range" min="0.7" max="1.4" step="0.05" value="1"></label>
            <div class="voice-row"><button type="button" id="mix-preview" class="preview" data-i18n="settings.voice.preview"></button><button type="button" id="mix-save" data-i18n="settings.mix.save"></button><button type="button" id="mix-cancel" data-i18n="settings.mix.cancel"></button></div>
            <p class="voice-note" data-i18n="settings.mix.note"></p>
          </div>
          <div id="voice-vv" hidden>
            <div class="voice-row"><span id="vv-status" class="voice-note"></span><button type="button" id="vv-install" hidden data-i18n="settings.vv.downloadPlain"></button></div>
            <progress id="vv-progress" max="1" value="0" hidden></progress>
            <div id="vv-pick" hidden>
              <label data-i18n="settings.vv.character"><select id="vv-speaker" translate="no"></select></label><label data-i18n="settings.mix.style"><select id="vv-style" translate="no"></select></label>
              <label data-i18n="settings.voice.speed"> <span id="vv-speed-value"></span><input id="vv-speed" type="range" min="0.7" max="1.5" step="0.05" value="1"></label>
              <label data-i18n="settings.mix.pitch"> <span id="vv-pitch-value"></span><input id="vv-pitch" type="range" min="-0.15" max="0.15" step="0.01" value="0"></label>
              <div class="voice-row"><button type="button" id="vv-preview" class="preview" data-i18n="settings.voice.preview"></button><button type="button" id="vv-save" data-i18n="settings.mix.save"></button><button type="button" id="vv-cancel" data-i18n="settings.mix.cancel"></button></div>
            </div>
            <p class="voice-note" data-i18n="settings.vv.note"></p>
          </div>
        </div>
      </section>
      <section class="pane" data-pane="wake" hidden><h3 class="pane-title" data-i18n="settings.nav.wake"></h3>
        <div id="wake-settings">
          <label class="check"><input type="checkbox" id="wake-enabled"> <span data-i18n="settings.wake.enabled"></span></label>
          <div class="voice-row"><span id="wake-listening" data-i18n="settings.wake.mic"></span><meter id="mic-level" min="0" max="0.5" low="0.02" high="0.3" optimum="0.1" value="0"></meter></div>
          <label data-i18n="settings.wake.phrases"><input id="wake-phrases" maxlength="200" translate="no" data-i18n-placeholder="settings.wake.phrasesPlaceholder"></label>
          <label data-i18n="settings.wake.dictation"><select id="dictation-engine"><option value="local" data-i18n="settings.wake.dictationLocal"></option><option value="typeless" data-mac-only data-i18n="settings.wake.dictationTypeless"></option></select></label><p id="typeless-note" class="voice-note" hidden></p>
          <label data-i18n="settings.wake.sensitivity"><select id="wake-sensitivity"><option value="high" data-i18n="settings.wake.sensitivityHigh"></option><option value="normal" data-i18n="settings.wake.sensitivityNormal"></option></select></label>
        <label class="check"><input type="checkbox" id="barge-in"> <span data-i18n="settings.wake.bargeIn"></span></label>
        <label class="check"><input type="checkbox" id="conversation-mode"> <span data-i18n="settings.wake.conversation"></span></label>
          <div class="voice-row"><span id="asr-status"></span><button type="button" id="asr-install" data-i18n="settings.wake.asrInstall"></button></div>
          <progress id="asr-progress" max="1" value="0" hidden></progress>
          <p class="voice-note" data-i18n="settings.wake.note"></p>
        </div>
      </section>
      <section class="pane" data-pane="characters" hidden><h3 class="pane-title" data-i18n="settings.nav.characters"></h3>
        <div id="person-settings"><b class="section-title" data-i18n="settings.characters.photoTitle"></b><div class="voice-row"><button type="button" id="person-open" data-i18n="settings.characters.photoOpen"></button></div><ul id="person-list"></ul></div>
      </section>
      <section class="pane" data-pane="games" hidden><h3 class="pane-title" data-i18n="settings.nav.games"></h3>
        <div id="watch-settings"><label data-i18n="settings.games.watch"><select id="watch-source"><option value="" data-i18n="settings.games.chooseWindow"></option></select></label>
          <label data-i18n="settings.games.game"><input id="watch-game" maxlength="80" data-i18n-placeholder="settings.games.gamePlaceholder"></label>
          <div class="voice-row"><button type="button" id="watch-refresh" data-i18n="settings.games.refresh"></button><button type="button" id="watch-toggle" data-i18n="settings.games.start"></button></div><p id="watch-status" class="voice-note"></p></div>
        <div id="game-settings"><label data-i18n="settings.games.choice"><select id="game-choice"><option value="lane" data-i18n="settings.games.lane"></option><option value="pikachu" data-i18n="settings.games.pikachu"></option></select></label><p id="game-third-party" class="voice-note" data-i18n="settings.games.thirdParty"></p><label data-i18n="settings.games.engine"><select id="game-engine"><option value="laya" data-i18n="settings.games.laya"></option><option value="jev" data-i18n="settings.games.jev"></option></select></label>
          <div id="game-jev" hidden><div class="voice-row"><span id="game-jev-status"></span><button type="button" id="game-jev-get" data-i18n="settings.games.jevGet"></button><button type="button" id="game-jev-clear" hidden data-i18n="settings.games.jevClear"></button></div><input id="game-jev-key" type="password" data-i18n-placeholder="settings.games.jevPlaceholder" autocomplete="off"><div class="voice-row"><button type="button" id="game-jev-save" data-i18n="settings.games.jevSave"></button></div></div>
          <button type="button" id="open-game" data-i18n="settings.games.open"></button></div>
      </section>
      <section class="pane" data-pane="remote" hidden><h3 class="pane-title" data-i18n="settings.nav.remote"></h3>
        <div id="remote-settings"><b class="section-title" data-i18n="settings.remote.title"></b>
          <p id="remote-status" class="voice-note"></p>
          <label class="check" id="remote-tasks-row" hidden><input type="checkbox" id="remote-tasks"> <span data-i18n="settings.remote.tasks"></span></label>
          <div class="voice-row"><button type="button" id="remote-toggle" data-i18n="settings.remote.turnOn"></button><button type="button" id="remote-pair" hidden data-i18n="settings.remote.pair"></button></div>
          <div id="remote-qr" hidden><div id="remote-qr-image"></div><p class="voice-note"><span data-i18n="settings.remote.qrBefore"></span><span id="remote-link"></span><span data-i18n="settings.remote.qrMiddle"></span><b id="remote-code"></b><span data-i18n="settings.remote.qrAfter"></span></p></div>
          <ul id="remote-devices"></ul></div>
      </section>
      <section class="pane" data-pane="general" hidden><h3 class="pane-title" data-i18n="settings.nav.general"></h3>
        <label><span data-i18n="settings.general.uiLanguage"></span><select id="ui-language"><option value="auto" data-i18n="settings.general.uiLanguageAuto"></option><option value="zh-Hant" translate="no">繁體中文</option><option value="zh-Hans" translate="no">简体中文</option><option value="en" translate="no">English</option><option value="ja" translate="no">日本語</option></select></label>
        <button type="button" id="show-onboarding" data-i18n="settings.general.showOnboarding"></button>
      </section>
      </div>
      <button id="save" data-i18n="settings.save"></button>
    </div>
    <div id="dev-bar" hidden><span id="dev-label"></span><button type="button" id="dev-stop" data-i18n="companion.dev.stop" data-i18n-title="companion.dev.stopTitle"></button><button type="button" id="dev-leave" data-i18n="companion.dev.leave" data-i18n-title="companion.dev.leaveTitle"></button></div>
    <section id="dev-picker" hidden data-i18n-aria-label="companion.dev.pickerAria">
      <div class="dev-picker-head"><b data-i18n="companion.dev.pickerTitle"></b><button type="button" id="dev-refresh" data-i18n-title="companion.dev.refresh">↻</button><button type="button" id="dev-close" data-i18n-title="companion.dev.close">×</button></div>
      <p class="voice-note" id="dev-picker-note" data-i18n="companion.dev.pickerNote"></p>
      <label class="check"><input type="checkbox" id="dev-ask-codex"> <span data-i18n="companion.dev.askCodex"></span></label>
      <ul id="dev-list"></ul>
    </section>
    <div id="conversation" aria-live="polite" translate="no"><div class="message assistant" data-i18n="chat.greeting" data-i18n-vars='{"name":"Annie"}'></div></div>
    <form id="chat-form"><textarea rows="1" id="prompt" data-i18n-aria-label="chat.promptAria" data-i18n-placeholder="chat.placeholder" data-i18n-vars='{"name":"Annie"}' maxlength="2000" autocomplete="off"></textarea><button id="voice-input" type="button" aria-pressed="false" data-i18n-title="chat.voiceInput">🎙</button><button id="send" data-i18n-title="chat.send">↑</button></form>
    <footer><span id="status"></span><button id="listen-stop" type="button" hidden data-i18n="chat.listen.stop"></button><button id="reset" data-i18n="chat.clear"></button></footer>
  </section>
  <div id="subtitle" hidden translate="no"></div>
  <div id="pet-wrap" data-i18n-title="avatar.dragHint">
    <!-- The selected Mod model is mounted by the shared avatar renderer. -->
  </div>
  <button id="stop-speech" type="button" hidden data-i18n="toolbar.stopSpeech" data-i18n-title="toolbar.stopSpeechTitle"></button>
  <nav id="toolbar"><button id="speak-toggle" type="button" data-i18n-title="toolbar.mute" data-i18n-aria-label="toolbar.mute">🔊</button><button id="mic-toggle" type="button" hidden data-i18n-title="toolbar.stopListening" data-i18n-aria-label="toolbar.stopListening"><span id="mic-indicator"></span></button><button id="wardrobe" data-i18n-title="toolbar.wardrobe">◈ Skin</button><button id="files" data-i18n-title="toolbar.files" data-i18n-aria-label="toolbar.filesAria">📁</button><button id="dev-open" data-i18n-title="toolbar.dev" data-i18n-aria-label="toolbar.devAria">🧑‍💻</button></nav>
