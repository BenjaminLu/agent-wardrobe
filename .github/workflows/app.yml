name: app
on:
  push:
    paths-ignore: ['**.md', 'LICENSE*', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE*', 'NOTICE']
jobs:
  test:
    # Apple Silicon runner: the app targets macOS and ships arm64 native speech libraries.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Electron smoke tests (offline set)
        run: npm run smoke
      - name: Smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: evidence/*.png
          if-no-files-found: ignore
